<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g fill="none" stroke="#00D4FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer gear circle -->
    <circle cx="32" cy="32" r="16"/>

    <!-- Gear teeth -->
    <g>
      <!-- Top tooth -->
      <line x1="32" y1="10" x2="32" y2="5"/>
      <!-- Top-right teeth -->
      <line x1="43.3" y1="13.1" x2="47.3" y2="9.1"/>
      <!-- Right tooth -->
      <line x1="54" y1="32" x2="59" y2="32"/>
      <!-- Bottom-right tooth -->
      <line x1="43.3" y1="50.9" x2="47.3" y2="54.9"/>
      <!-- Bottom tooth -->
      <line x1="32" y1="54" x2="32" y2="59"/>
      <!-- Bottom-left tooth -->
      <line x1="20.7" y1="50.9" x2="16.7" y2="54.9"/>
      <!-- Left tooth -->
      <line x1="10" y1="32" x2="5" y2="32"/>
      <!-- Top-left tooth -->
      <line x1="20.7" y1="13.1" x2="16.7" y2="9.1"/>
    </g>

    <!-- Inner circle -->
    <circle cx="32" cy="32" r="6"/>
  </g>
</svg>
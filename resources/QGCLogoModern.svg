<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <style>
      .qgc-primary { fill: #00D4FF; }
      .qgc-secondary { fill: #ffffff; }
      .qgc-accent { fill: #7f3ff2; }
    </style>
  </defs>

  <!-- Background circle for icon usage -->
  <!-- <circle cx="128" cy="128" r="128" class="qgc-secondary" opacity="0.05"/> -->

  <!-- Drone Symbol (Top) -->
  <g id="drone">
    <!-- Main drone body -->
    <rect x="108" y="45" width="40" height="40" rx="8" class="qgc-primary"/>

    <!-- Drone rotors -->
    <!-- Left rotor arm -->
    <g>
      <line x1="70" y1="65" x2="108" y2="65" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="55" cy="65" r="7" class="qgc-primary"/>
    </g>

    <!-- Right rotor arm -->
    <g>
      <line x1="148" y1="65" x2="186" y2="65" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="201" cy="65" r="7" class="qgc-primary"/>
    </g>

    <!-- Front rotors (slight angle) -->
    <g>
      <line x1="80" y1="45" x2="110" y2="25" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="65" cy="30" r="7" class="qgc-primary"/>
    </g>

    <g>
      <line x1="176" y1="45" x2="146" y2="25" stroke="#00D4FF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="191" cy="30" r="7" class="qgc-primary"/>
    </g>
  </g>

  <!-- Signal/Control Lines -->
  <g id="signals" opacity="0.6">
    <path d="M 128 95 Q 110 120 100 145" stroke="#00D4FF" stroke-width="2" fill="none" stroke-dasharray="4,3" stroke-linecap="round"/>
    <path d="M 128 95 Q 146 120 156 145" stroke="#00D4FF" stroke-width="2" fill="none" stroke-dasharray="4,3" stroke-linecap="round"/>
  </g>

  <!-- Ground Station (Bottom) -->
  <g id="ground-station">
    <!-- Antenna mast -->
    <rect x="122" y="145" width="12" height="45" rx="6" class="qgc-primary"/>

    <!-- Antenna lines (signal radiation) -->
    <g opacity="0.8">
      <path d="M 128 145 Q 110 135 95 130" stroke="#00D4FF" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M 128 145 Q 146 135 161 130" stroke="#00D4FF" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M 128 145 Q 100 150 85 160" stroke="#00D4FF" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M 128 145 Q 156 150 171 160" stroke="#00D4FF" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Ground base -->
    <ellipse cx="128" cy="200" rx="50" ry="8" class="qgc-primary"/>

    <!-- Ground connection points -->
    <circle cx="98" cy="200" r="5" class="qgc-secondary" stroke="#00D4FF" stroke-width="2"/>
    <circle cx="158" cy="200" r="5" class="qgc-secondary" stroke="#00D4FF" stroke-width="2"/>
    <circle cx="128" cy="210" r="5" class="qgc-secondary" stroke="#00D4FF" stroke-width="2"/>
  </g>

  <!-- Accent dots representing data/connection -->
  <g id="data-points" opacity="0.7">
    <circle cx="90" cy="100" r="2.5" class="qgc-accent"/>
    <circle cx="166" cy="100" r="2.5" class="qgc-accent"/>
    <circle cx="70" cy="150" r="2.5" class="qgc-accent"/>
    <circle cx="186" cy="150" r="2.5" class="qgc-accent"/>
  </g>
</svg>